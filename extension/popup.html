<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kite Pattern Radar</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .card {
      background: #161b26;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pattern-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ticker {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .bullish { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .bearish { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .time {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #7ec8f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡ Kite Pattern Radar</span>
    </div>
    <div class="status-pill" id="statusPill">ACTIVE READ</div>
  </div>

  <div class="card">
    <div class="card-title">Latest Pattern Alert</div>
    <div id="latestContent">
      <div style="font-size: 11px; color: #64748b; text-align: center; padding: 12px 0;">
        Scanning live chart stream on Zerodha...
      </div>
    </div>
  </div>

  <button class="btn" id="openHubBtn">
    🚀 Open Live Pattern Hub Page
  </button>

  <script src="popup.js"></script>
</body>
</html>
